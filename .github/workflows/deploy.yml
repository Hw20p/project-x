name: Deploy

# main 브랜치에 push하면 빌드해서 test.maplespec.kr 서버에 올린다. (수동 실행도 가능)
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 배포가 겹쳐서 서로 덮어쓰지 않게 한 번에 하나만 돌린다.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # tsc 타입체크를 포함하므로, 타입 오류가 있는 코드는 여기서 멈추고 배포되지 않는다.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'frontend/dist/*'
          target: /tmp/lifesim-new
          strip_components: 2
          # 이전 배포가 중간에 실패해서 남은 파일이 섞이지 않게 올리기 전에 비운다.
          rm: true

      - name: Swap into place
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            rm -rf /home/deploy/apps/lifesim/current
            mv /tmp/lifesim-new /home/deploy/apps/lifesim/current
            # nginx(다른 사용자)가 읽을 수 있게 권한을 맞춘다. 이 줄이 없으면 배포 직후 403이 날 수 있다.
            chmod -R u=rwX,go=rX /home/deploy/apps/lifesim/current
